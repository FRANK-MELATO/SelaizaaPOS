version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: atchaar_pos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: atchaar_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: atchaar_pos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: atchaar_pos
      DB_USER: postgres
      DB_PASSWORD: postgres123
      JWT_SECRET: change_this_secret_in_production_very_long_string
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"

volumes:
  postgres_data:
  uploads_data:
